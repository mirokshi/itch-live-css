<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración · itch-live-css</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="site">
  <header><h1>Revisión del expositor</h1></header>
  <!-- the key is the ADMIN_KEY env var; it is kept only in this tab (sessionStorage) -->
  <form id="login" class="row">
    <label>Clave de administración <input type="password" id="key" autocomplete="off" required></label>
    <button type="submit">Entrar</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="list" class="cards"></ul>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
