<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile preview</title>
<!-- A generic itch.io profile with the default theme. Our own markup and styles, following the
     structure in knowledge/sections/03 (itch's HTML and CSS are not copied). The page fills #bio,
     style#live (the effects, as the @import would bring them) and style#custom_css (the user's CSS). -->
<link rel="stylesheet" href="preview.css">
<style id="live"></style>
<style id="custom_css"></style>
</head>
<body class="user_layout_widget layout_widget responsive">
<div id="wrapper" class="user_page_wrap">
  <div class="user_page page_widget base_widget mode_grid">
    <div id="profile_header" class="header">
      <div class="inner_column text_header"><h1>username</h1></div>
    </div>
    <div class="inner_column profile_content">
      <div class="columns">
        <div class="column profile_column">
          <div class="user_links user_links_widget base_widget">
            <span class="link_group"><span class="icon icon-link"></span><a href="#">example.com</a></span>
          </div>
          <div class="user_profile formatted" id="bio"></div>
        </div>
        <div class="column game_column">
          <div class="game_grid_widget base_widget user_game_grid">
            <div class="game_cell" data-game_id="1">
              <a class="game_thumb" href="#"></a>
              <div class="game_cell_data">
                <div class="game_title"><a class="title game_link" href="#">First Game</a></div>
                <div class="game_text">A short description of the game.</div>
                <div class="game_genre">Adventure</div>
              </div>
            </div>
            <div class="game_cell" data-game_id="2">
              <a class="game_thumb" href="#"></a>
              <div class="game_cell_data">
                <div class="game_title"><a class="title game_link" href="#">Second Game</a></div>
                <div class="game_text">Another game, made for a jam.</div>
                <div class="game_genre">Puzzle</div>
              </div>
            </div>
            <div class="game_cell" data-game_id="3">
              <a class="game_thumb" href="#"></a>
              <div class="game_cell_data">
                <div class="game_title"><a class="title game_link" href="#">Third Game</a></div>
                <div class="game_text">A small prototype.</div>
                <div class="game_genre">Platformer</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer"><div class="footer_inner"><a href="#">itch.io</a> <a href="#">View all by username</a></div></div>
</div>
</body>
</html>
