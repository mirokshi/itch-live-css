<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sec07: :target on a[name]</title>
<!--
  Written for section 07, 2026-10-14. Does :target match an <a name> anchor (itch strips id, keeps name)?
  Run twice:
    chrome --headless=new --user-data-dir=<tmp> --virtual-time-budget=2000 --dump-dom "file:///.../sec07-target.html#custom-tab2"
    chrome --headless=new --user-data-dir=<tmp> --virtual-time-budget=2000 --dump-dom "file:///.../sec07-target.html#ctl-id"
-->
<style>
  #wrapper .custom-panel{display:none}
  #wrapper a[name]:target + .custom-panel{display:block;width:41px}
  #wrapper span:target{display:block;width:43px}
</style></head>
<body><div id="wrapper">
  <a name="custom-tab1"></a><div class="custom-panel" id="p1">one</div>
  <a name="custom-tab2"></a><div class="custom-panel" id="p2">two</div>
  <span id="ctl-id"></span>
</div>
<pre id="out"></pre>
<script>
const cs = id => getComputedStyle(document.getElementById(id));
function report(tag){
  const t = document.querySelector(':target');
  document.getElementById('out').textContent += [
    '[' + tag + '] hash=' + location.hash,
    'p2 display=' + cs('p2').display + ' width=' + cs('p2').width,
    'a[name=custom-tab2] matches :target = ' + document.querySelector('a[name="custom-tab2"]').matches(':target'),
    'span#ctl-id matches :target = ' + document.getElementById('ctl-id').matches(':target'),
    ':target element = ' + (t ? t.outerHTML : 'none')
  ].join('\n') + '\n';
}
report('sync');
setTimeout(() => report('after 300ms'), 300);
</script></body></html>
